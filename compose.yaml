# Home Datacenter — Docker Compose
#
# Three services: api (Go), mosquitto (MQTT broker), web (nginx SPA).
# All secrets come from the .env file loaded by compose (see
# .env.example). No secret material is committed to this repo.
#
# Network posture:
#   - Only ports 80 (web) and 8080 (api) are published to the host,
#     and only for local dev. In production behind Cloudflare Tunnel
#     you can stop publishing 8080 — the tunnel reaches the api
#     service on the internal Docker network by name (home-api).
#   - Mosquitto port 1883 is NOT published to the host by default;
#     the api reaches it on the internal network as "home-mosquitto:1883"
#     (container name — compose sets container_name, so the bare service
#     name "mosquitto" is not resolvable). Set MQTT_BIND_PORT below if
#     you need host access for local device testing.
#
# Security hardening:
#   - All services run with no-new-privileges:true.
#   - api, web, cloudflared additionally use cap_drop: ALL (our own
#     code or simple daemons that don't need capabilities).
#   - mosquitto and frigate keep default capabilities — they are
#     third-party images whose init systems need chown/dac_override
#     for file permission setup. no-new-privileges:true still
#     provides defense-in-depth.
#   - The web service adds back NET_BIND_SERVICE so nginx can bind
#     port 80 (its master process still drops to the nginx user for
#     worker processes via setuid — no setuid binary involved, so
#     no-new-privileges does not interfere).
#   - Frigate's ports 5000 (REST API) and 1984 (go2rtc) are bound to
#     127.0.0.1 — no internal service needs them via the host; all
#     reach Frigate on the Docker network as home-frigate:5000/1984.

# v1.8.27: global container log rotation. Without this, every service
# used Docker's default json-file driver with NO size cap — mosquitto
# had grown to 84M and frigate to 44M, growing forever. max-size caps
# each log file at 10MB and max-file keeps only 3, so a chatty service
# can never fill the disk. Applied to every service via the anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./services/api
    container_name: home-api
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # v1.8.26: VAAPI hardware transcoding. /dev/dri/renderD128 is the
    # Intel iGPU render node on the NAS (Celeron J4125). Passing it in
    # lets PlayRecording use h264_vaapi instead of software libx264,
    # cutting a 60s clip transcode from ~40s to ~3s. group_add 105 =
    # the render group GID on the NAS; the container's app user (UID
    # 1000) needs membership to open the device node. camera_handler.go
    # falls back to libx264 automatically if the device is absent.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "105"
    # Bind to 0.0.0.0 so LAN devices can reach the API directly.
    # In production behind Cloudflare Tunnel, the tunnel reaches the
    # API by service name (home-api) on the internal network.
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./data/sqlite:/data/sqlite
      - ./data/recordings:/data/recordings
      # Frigate recordings (read-write) so home-api can serve MP4
      # segments directly from disk via http.ServeFile AND delete a
      # camera's recording directory when the camera is unregistered.
      # Frigate 0.17 has no REST endpoint for downloading individual
      # recording segments — they are only available as files on disk
      # at /media/frigate/recordings/YYYY-MM-DD/HH/<cam>/MM.SS.mp4.
      - ./data/frigate:/media/frigate
      - ./services/api/configs:/configs:ro
      # v1.6.11: APK releases directory. The host's
      # ./data/releases/ holds app-debug-vX.Y.Z.apk files pushed
      # here by push-apk.ps1 (or any other deploy tool). The api
      # container scans this directory and serves the highest
      # version via GET /api/v1/release/latest and
      # GET /api/v1/release/latest/apk.
      # v1.8.27: read-write (was :ro) so the startup/daily
      # CleanupOldReleases loop can prune old versions (only files
      # matching "app-debug-vX.Y.Z.apk" are ever deleted — matched
      # strictly by listAll), keeping the directory bounded.
      - ./data/releases:/data/releases
      # v1.8.29: off-NAS backup status file, written by the backup
      # container and read (read-only) by the api's BackupMonitor to
      # alert on failed/stalled syncs and bucket retention.
      - ./data/backup-state:/data/backup-state:ro
    depends_on:
      mosquitto:
        condition: service_started
      frigate:
        condition: service_healthy
      vision:
        condition: service_started
    # v1.8.28: service healthcheck. The api image is alpine (busybox
    # wget is present), so this probes the /health endpoint directly.
    # service_healthy lets a restart policy / down-stream depends_on
    # react to a dead API instead of a merely-started container.
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      - APP_CONFIG=${APP_CONFIG:-/configs/config.yaml}
      # v1.5.13: match Frigate's TZ so PlayRecording path lookups
      # use LOCAL date components (the disk layout is now LOCAL
      # after Frigate TZ change). Also makes any Go time.Now() calls
      # return LOCAL time, which is what the user expects in logs.
      - TZ=Asia/Shanghai
      # Secret material via env (preferred). See .env.example.
      - JWT_SECRET=${JWT_SECRET:-}
      - MQTT_USERNAME=${MQTT_USERNAME:-home-datacenter}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - GO2RTC_BASE_URL=${GO2RTC_BASE_URL:-http://home-frigate:1984}
      - FRIGATE_BASE_URL=${FRIGATE_BASE_URL:-http://home-frigate:5000}
      - VISION_BASE_URL=${VISION_BASE_URL:-http://home-vision:8090}
      # v1.6.22: NAS public IPv6 address. The container cannot probe
      # IPv6 reachability itself (home-net bridge has no IPv6 subnet),
      # so we expose the host's public IPv6 address via env var. When
      # set, CheckIPv6() reports enabled+reachable=true and includes
      # this address — dashboard's network card and Android's IPv6
      # direct mode then both work. Update this value if the ISP
      # rotates the IPv6 prefix (find via: ip -6 addr show enp4s0 |
      # grep "scope global" | grep -v temporary).
      - NAS_IPV6_ADDRESS=${NAS_IPV6_ADDRESS:-2409:8a70:37ad:6870:62be:b4ff:fe08:bd09}
      # v1.8.24: NAS LAN IPv4 address. The container runs on a Docker
      # bridge (172.x.x.x) and cannot infer the host's physical LAN IP.
      # This value is used by SetWebRTCCandidates() to build the go2rtc
      # webrtc.candidates list — without it, WebRTC is unreachable from
      # LAN clients. Update when the NAS IP changes.
      - NAS_LAN_IP=${NAS_LAN_IP:-192.168.31.235}
      # v1.8.24: Set to "true" in offline LAN environments (no Internet)
      # to disable IPv6 reporting. Without this, NAS_IPV6_ADDRESS above
      # would cause CheckIPv6() to report reachable=true, making the
      # mobile app waste time on IPv6 direct mode that can never succeed.
      - NAS_IPV6_DISABLED=${NAS_IPV6_DISABLED:-false}
    # v1.8.31: static IP for the api service. nginx's
    # `upstream api_backend { server api:8080; }` in web/nginx.conf
    # resolves the `api` hostname ONCE at nginx startup and keeps
    # that IP cached for the lifetime of the web container. When the
    # api container is recreated on a redeploy, Docker gives it a NEW
    # IP, so the running web container keeps proxying to a dead IP and
    # every /api/* request returns 502 — the Android app then reports
    # "All 3 attempts failed for /api/v1/user". Pinning api to a fixed
    # address in home-net makes its IP stable across recreates, so the
    # nginx upstream never goes stale. The subnet must be declared in
    # the network block below for the static assignment to work.
    networks:
      home-net:
        ipv4_address: 172.18.0.10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: home-mosquitto
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # cap_drop: ALL is not set here — the official entrypoint needs
    # chown to fix permissions on the mounted passwd file. The
    # broker itself runs as mosquitto user (non-root) after startup.
    # Not published by default. Uncomment and set MQTT_BIND_PORT only
    # if a local physical device needs to reach the broker from the host.
    # ports:
    #   - "127.0.0.1:${MQTT_BIND_PORT:-1883}:1883"
    entrypoint: [ "/mosquitto/config/docker-entrypoint.sh" ]
    volumes:
      - ./deploy/mosquitto/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh:ro
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./data/mosquitto:/mosquitto/data
    # v1.8.28: healthcheck. eclipse-mosquitto is alpine-based and has
    # no HTTP endpoint, so we probe the broker process directly via
    # busybox pgrep instead of a TCP/HTTP check. A running broker
    # process is the right "i'm up" signal; a healthcheck here lets
    # restart / depends_on react if the broker dies.
    healthcheck:
      test: [ "CMD", "pgrep", "mosquitto" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - home-net

  web:
    build:
      context: ./web
    container_name: home-web
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx official image entrypoint runs as root and does chown
    # on /var/cache/nginx/* to ensure the nginx user (uid 101) can
    # write cache files. NET_BIND_SERVICE allows binding port 80.
    # After startup, nginx master drops to the nginx user for worker
    # processes via setuid() — not execve of a setuid binary, so
    # no-new-privileges does not interfere with privilege dropping.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    # Port 8088 on the host maps to 80 in the container. Port 80
    # on the host is typically occupied by the NAS web UI.
    #
    # v1.6.23: dual-stack binding (IPv4 + IPv6). The previous
    # "0.0.0.0:8088:80" only bound IPv4, which forced remote mobile
    # clients (on CGNAT IPv4 with IPv6) to route through the
    # Cloudflare Tunnel (1.4s TTFB) even when both NAS and phone had
    # IPv6 connectivity. With IPv6 bound, the Android app's
    # BaseUrlResolver can now pick http://[NAS_IPV6]:8088/ as a
    # direct path when the phone has IPv6 — TTFB drops from ~1.4s
    # to ~50ms. docker-proxy handles the IPv6→IPv4 translation to
    # the container's internal 0.0.0.0:80, so nginx needs no config
    # change. We keep 0.0.0.0 explicit (instead of bare "8088:80")
    # so the IPv4 binding is unchanged on Docker setups where the
    # default bind address differs.
    ports:
      - "0.0.0.0:8088:80"
      - "[::]:8088:80"
    depends_on:
      - api
    # v1.8.28: healthcheck. nginx:alpine bundles busybox wget, so we
    # probe the SPA root. A 200/40x from nginx means the server is up
    # and serving (it returns 200 for /; the app is a static SPA).
    #
    # Must use 127.0.0.1, NOT localhost: nginx:alpine's /etc/hosts maps
    # `::1 localhost ip6-loopback`, and busybox wget resolves `localhost`
    # to the IPv6 loopback ::1 first. nginx only listens on IPv4
    # 0.0.0.0:80 here, so wget against `localhost` fails with
    # "Connection refused" while the server is actually healthy.
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - home-net

  # vision — Edge Vision AI microservice (Intel Celeron J4125)
  # Lightweight, AVX2-free face recognition (YuNet + SFace) & 17-point pose/fall detection
  vision:
    build:
      context: ./services/vision
    container_name: home-vision
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/vision:/data/vision
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      - TZ=Asia/Shanghai
    networks:
      - home-net

  # frigate — NVR with built-in go2rtc, AI object detection,
  # and recording. Replaces the standalone go2rtc container.
  #
  # Frigate bundles go2rtc internally on port 1984 (same API as the
  # standalone container). The Frigate REST API is on port 5000.
  # home-api pushes camera config to Frigate via PUT /api/config/save
  # so the AI detection pipeline knows about each camera.
  #
  # Ports:
  #   1984 — bundled go2rtc HTTP API (stream management, SDP, HLS)
  #   5000 — Frigate REST API (config, events, snapshots)
  #   8555 — WebRTC media (TCP ICE + UDP ICE, same as standalone go2rtc)
  #
  # SET_CONFIG_BY_API=true enables the PUT /api/config/save endpoint
  # so home-api can push camera definitions dynamically.
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: home-frigate
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # cap_drop: ALL is not set here — Frigate's s6-overlay init
    # system needs chown/dac_override for log directory setup and
    # /dev/shm management. Frigate is a complex third-party NVR
    # image; stripping all capabilities breaks its startup.
    # no-new-privileges:true still provides defense-in-depth.
    environment:
      - SET_CONFIG_BY_API=true
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:-}
      # v1.5.13: Frigate stores recordings under /media/frigate/recordings/YYYY-MM-DD/HH/<cam>/MM.SS.mp4
      # using UTC date components. Without TZ=Asia/Shanghai, "a day's
      # recordings" as seen by the dashboard spans 7.19 08:00 LOCAL
      # to 7.20 08:00 LOCAL (because UTC 7.19 00:00 = LOCAL 7.19 08:00).
      # Setting TZ fixes both the directory partitioning AND the
      # Frigate REST API start_time interpretation so the user's
      # "play 7.19" actually plays 7.19 00:00..7.20 00:00 LOCAL.
      - TZ=Asia/Shanghai
      # MQTT credentials — shared with home-api so Frigate can publish
      # detection events and stats to the same mosquitto broker.
      # Frigate's env var substitutor (frigate/config/env.py) ONLY
      # reads env vars starting with "FRIGATE_", so the names MUST
      # be prefixed. config.yml references them via
      # {FRIGATE_MQTT_USERNAME} / {FRIGATE_MQTT_PASSWORD}.
      - FRIGATE_MQTT_USERNAME=${MQTT_USERNAME:-home-datacenter}
      - FRIGATE_MQTT_PASSWORD=${MQTT_PASSWORD:-}
    ports:
      # Frigate REST API (config, events, snapshots). Bound to
      # 127.0.0.1 — all internal services (api, web nginx proxy)
      # reach Frigate via the Docker network (home-frigate:5000),
      # so the host port is only for local debugging.
      - "127.0.0.1:5000:5000"
      # Bundled go2rtc HTTP API (HLS, WebRTC SDP signalling).
      # Bound to 127.0.0.1 — go2rtc has no built-in auth, so
      # exposing it on 0.0.0.0 would let anyone on the LAN pull
      # camera streams. Internal services use home-frigate:1984.
      - "127.0.0.1:1984:1984"
      # WebRTC media: TCP ICE + UDP ICE. Browser needs direct
      # access for ICE connectivity checks.
      - "8555:8555"
      - "8555:8555/udp"
    volumes:
      # v1.8.27: persist Frigate's /config directory (frigate.db,
      # backup.db, .jwt_secret, ...) on the host. Previously only
      # config.yml was mounted (read-only from the repo), so the
      # event database lived in the container's writable layer and
      # was LOST on every container recreate/upgrade — recordings
      # survived but the event timeline/search index did not. The
      # file mount below overlays the repo's config.yml on top of
      # this directory, so config pushes still work as before.
      - ./data/frigate/config:/config
      - ./deploy/frigate/config.yml:/config/config.yml
      - ./data/frigate:/media/frigate
      - ./data/recordings:/data/recordings
    # Shared memory for Frigate's inter-process frame passing
    # (capture → detect → output). Docker's default 64MB is too
    # small for 3+ high-res cameras (2560x1440 yuv420p ≈ 5.5MB
    # per frame); starvation causes camera_fps=0 even though
    # ffmpeg is producing frames. 512MB covers 3 cameras with
    # comfortable headroom.
    shm_size: 512m
    # Intel GPU (UHD Graphics 600 on J4125) passthrough for VAAPI
    # hardware decoding. /dev/dri/renderD128 is the compute-only
    # render node — safer than /dev/dri/card0 which grants display
    # privileges. Required for both:
    #   - Frigate's ffmpeg (detection decode, preset-vaapi)
    #   - go2rtc's ffmpeg (live transcode, #hardware=vaapi)
    # Without this, ffmpeg falls back to software decode → high CPU.
    # On Docker Desktop (Windows/WSL2) GPU passthrough is not
    # supported — comment out and remove hwaccel_args to fall back.
    #
    # GPU access is via the devices: directive (device cgroup),
    # not via capabilities, so cap_drop: ALL does not affect VAAPI.
    devices:
      - /dev/dri:/dev/dri
    # Healthcheck: check the Frigate REST API is responding.
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5000/api/config" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - home-net

  # cloudflared — Cloudflare Tunnel for public access. Routes public
  # hostnames (dashboard.feiyemomo.top, api.feiyemomo.top,
  # cam.feiyemomo.top) to internal Docker services by name. Must be
  # on the same network as the other services so it can resolve
  # "web", "api" etc.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: home-cloudflared
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Config-file mode: ingress rules are defined locally in
    # deploy/cloudflared/config.yaml and the tunnel credentials are
    # in deploy/cloudflared/credentials.json. This avoids needing
    # dashboard access to configure Public Hostnames — everything is
    # in the repo and version-controlled.
    #
    # To switch back to token mode (dashboard-managed ingress):
    #   1. Set CLOUDFLARE_TOKEN in .env
    #   2. Replace the command below with:
    #      tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    #   3. Remove the volumes below
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yaml run
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    volumes:
      - ./deploy/cloudflared/config.yaml:/etc/cloudflared/config.yaml:ro
      - ./deploy/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - api
      - web
    networks:
      - home-net

  # coturn — optional STUN/TURN for WebRTC across the public
  # internet. Without this, browsers can only reach go2rtc via
  # LAN or Cloudflare Tunnel (HTTP SDP only — no UDP media).
  # Disabled by default; uncomment the block below to enable.
  #
  #   coturn:
  #     build: ./deploy/coturn
  #     container_name: home-coturn
  #     restart: unless-stopped
  #     ports:
  #       - "3478:3478/udp"      # STUN/TURN UDP
  #       - "3478:3478"          # STUN/TURN TCP (fallback)
  #       - "5349:5349"          # TURN over TLS
  #       - "49160-49200:49160-49200/udp"  # relay
  #     networks:
  #       - home-net

  # backup — off-NAS offsite backup (v1.8.29). Syncs the daily SQLite
  # snapshots (data/sqlite/backups: app-*.db + frigate-*.db produced by
  # the api maintenance loop) to a Bitiful (亿安云) S3-compatible bucket
  # every BITIFUL_SYNC_INTERVAL. This is the "second copy" that survives
  # a NAS disk failure — the maintenance backups alone sit on the same
  # disk as the live DB.
  #
  # Why rclone: it's the standard S3-compatible sync tool, stable, and
  # configured here entirely via environment variables so no rclone.conf
  # (with embedded credentials) is committed to the repo.
  #
  # The source dir is mounted READ-ONLY (:ro) — the backup container
  # must never modify the maintenance backups, only read+push them.
  # `rclone sync` also acts as a remote mirror: locally-pruned files
  # are deleted remotely too, keeping the bucket bounded.
  #
  # Disable by leaving BITIFUL_ACCESS_KEY / BITIFUL_SECRET_KEY empty in
  # .env — the entrypoint exits 1 and the container just stays in
  # "exited" state (restart: unless-stopped won't retry a clean exit).
  backup:
    image: rclone/rclone:1.68
    container_name: home-backup
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No published ports — the container is egress-only (pushes to
    # Bitiful over HTTPS). It never listens.
    volumes:
      # Read-only: the backup container consumes, never mutates.
      - ./data/sqlite/backups:/backups:ro
      - ./data/backup-state:/state
      - ./deploy/backup/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: [ "sh", "/entrypoint.sh" ]
    environment:
      - TZ=Asia/Shanghai
      - BITIFUL_ENDPOINT=${BITIFUL_ENDPOINT:-https://s3.bitiful.net}
      - BITIFUL_REGION=${BITIFUL_REGION:-cn-east-1}
      - BITIFUL_BUCKET=${BITIFUL_BUCKET:-nas-data}
      - BITIFUL_ACCESS_KEY=${BITIFUL_ACCESS_KEY:-}
      - BITIFUL_SECRET_KEY=${BITIFUL_SECRET_KEY:-}
      - BITIFUL_SYNC_INTERVAL=${BITIFUL_SYNC_INTERVAL:-21600}
    networks:
      - home-net

networks:
  # v1.8.31: explicit /24 subnet so the api service can be pinned to a
  # static address (172.18.0.10). Without a declared subnet, Docker's
  # embedded DNS hands every container a fresh IP on each recreate and
  # nginx's one-time upstream resolution (web container) goes stale → 502.
  home-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
