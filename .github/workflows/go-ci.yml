name: Go CI

on:
  push:
    branches: [main, master]
    paths:
      - "services/api/**"
      - "deploy/ops-agent/**"
      - "testdata/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/api/**"
      - "deploy/ops-agent/**"
      - "testdata/**"
      - ".github/workflows/go-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Go Build, Vet & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Set up Python (for cross-language boundary tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deploy/ops-agent/requirements.txt

      - name: Install Python ops-agent dependencies
        run: python -m pip install --upgrade pip && pip install -r deploy/ops-agent/requirements.txt

      - name: Build Go packages and command binary
        working-directory: services/api
        run: go build ./internal/... ./cmd/...

      - name: Verify host-helper binary build
        working-directory: services/api
        run: go build -v ./cmd/host-helper

      - name: Cross-compile Linux amd64 binary (on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: services/api
        run: |
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build ./internal/... ./cmd/...

      - name: Run go vet
        working-directory: services/api
        run: go vet ./internal/... ./cmd/...

      - name: Run Go internal test suite
        working-directory: services/api
        run: go test -count=1 -timeout 360s ./internal/...
