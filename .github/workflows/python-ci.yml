name: Python Ops-Agent CI

on:
  push:
    branches: [main, master]
    paths:
      - "deploy/ops-agent/**"
      - "testdata/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "deploy/ops-agent/**"
      - "testdata/**"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} Ops-Agent Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go (for cross-process lease tests)
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: deploy/ops-agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/ops-agent/requirements.txt

      - name: Compile-check Python sources
        working-directory: deploy/ops-agent
        run: python -m compileall -q .

      - name: Run unittest suite
        working-directory: deploy/ops-agent
        run: python -m unittest discover -s tests -p "test_*.py" -v
