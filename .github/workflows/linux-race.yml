name: Linux Race & Docker Integration

on:
  push:
    branches: [main, master]
    paths:
      - "services/api/**"
      - "deploy/ops-agent/**"
      - "testdata/**"
      - ".github/workflows/linux-race.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/api/**"
      - "deploy/ops-agent/**"
      - "testdata/**"
      - ".github/workflows/linux-race.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-race:
    name: Go Race Detector (Ubuntu Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Set up Python (for cross-language tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deploy/ops-agent/requirements.txt

      - name: Install Python ops-agent dependencies
        run: python -m pip install --upgrade pip && pip install -r deploy/ops-agent/requirements.txt

      - name: Run Go race detector on security, audit, hostsec, and ops packages
        working-directory: services/api
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 -timeout 420s \
            ./internal/audit/... \
            ./internal/hostsec/... \
            ./internal/security/... \
            ./internal/redact/... \
            ./internal/middleware/... \
            ./internal/handler/... \
            ./internal/ops/...

      - name: Run real Docker socket integration test
        working-directory: services/api
        run: |
          docker info --format '{{.ServerVersion}}'
          go test -v -count=1 -timeout 60s -run TestR5_RealDockerSocket_Integration ./internal/ops/...
