# Home Datacenter API configuration
#
# Path resolution:
#   - Default lookup: configs/config.yaml (relative to CWD)
#   - Override via APP_CONFIG env var
#
# In Docker (WORKDIR /), this resolves to /configs/config.yaml,
# which is both baked into the image and bind-mounted by compose.yaml.
#
# SECURITY: the jwt.secret value here is a PLACEHOLDER only. The app
# refuses to start with this value (see internal/config/config.go ->
# validateJWTSecret). Set a real 32+ char secret via one of:
#   1. configs/config.local.yaml (gitignored — local dev)
#   2. the JWT_SECRET environment variable (preferred for Docker)
# Generate with: openssl rand -hex 32

server:
  port: 8080
  # Restrict which hostnames may open a WebSocket against /api/v1/ws.
  # Empty list = allow all (local dev). In production, list the
  # dashboard hostname(s) to block cross-site WebSocket hijacking.
  # allowed_origins:
  #   - dashboard.feiyemomo.top
  # Set the Secure attribute on the home_token auth cookie. Default
  # false: the LAN dashboard is served over plain HTTP, where a Secure
  # cookie would be dropped by the browser. Set to true when the
  # dashboard is reachable only over HTTPS (e.g. Cloudflare Tunnel).
  secure_cookie: false

database:
  path: /data/sqlite/app.db

jwt:
  secret: your-secret-key
  expire_days: 365

# /auth/bind online-bruteforce throttling. The 256-bit AccessKey
# already rules out offline attacks, but a determined attacker can
# still pound the live endpoint. The IP token-bucket in
# internal/middleware/ratelimit.go is bounded by these values.
# Set enabled: false to disable (e.g. for local soak tests).
auth:
  rate_limit:
    rps: 0.1        # steady-state: 1 attempt per 10 seconds per IP
    burst: 5        # bucket size: 5 attempts allowed back-to-back
    enabled: true

# Phase 3: MQTT broker (Mosquitto)
mqtt:
  broker: tcp://mosquitto:1883
  client_id: home-datacenter
  username: ""
  password: ""
  qos: 1

# Phase 3: WebSocket real-time push
websocket:
  path: /api/v1/ws
  heartbeat_seconds: 30

# Phase 4: Camera platformization
# Frigate bundles go2rtc internally. The go2rtc API is on port 1984
# and the Frigate REST API (config save, AI detection) is on port 5000.
# Override with GO2RTC_BASE_URL / FRIGATE_BASE_URL env vars if needed.
go2rtc:
  base_url: http://home-frigate:1984

frigate:
  base_url: http://home-frigate:5000

camera:
  # How often to TCP-probe each camera's RTSP port.
  health_interval_seconds: 15
  # Per-probe dial timeout.
  health_timeout_seconds: 3
  # Recording root. Must be a path that BOTH home-api and
  # home-go2rtc can see — i.e. a shared volume mounted at the same
  # location in both. Default /data/recordings assumes the bind
  # mount in compose.yaml.
  recording_dir: /data/recordings
  # WebRTC public base URL. Three modes:
  #   ""                       → LAN-only (returns the in-network
  #                              go2rtc URL, e.g. http://home-go2rtc:1984;
  #                              browsers outside Docker can't resolve it)
  #   "/go2rtc"                → reverse-proxied through the dashboard
  #                              nginx (location /go2rtc/ → home-go2rtc:1984).
  #                              Same-origin → no CORS, recommended default.
  #   "https://cam.example.com"→ separate Cloudflare Tunnel hostname
  webrtc_public_base: "/go2rtc"
  # ICE servers (STUN/TURN) returned to browsers. JSON array, e.g.:
  #   ice_servers: '[{"urls":"stun:stun.cloudflare.com:3478"},
  #                   {"urls":"turn:turn.example.com:3478",
  #                    "username":"x","credential":"y"}]'
  ice_servers: '[{"urls":"stun:stun.l.google.com:19302"},{"urls":"stun:stun.cloudflare.com:3478"}]'

# Phase 10: Network capability detection
# The server detects IPv6 availability, NAT type, and P2P feasibility
# by querying public STUN servers. Results are cached for
# check_interval_seconds and exposed via GET /api/v1/network/status.
# The mobile app uses this to decide: IPv6 direct → P2P → relay.
network:
  check_interval_seconds: 60
  # STUN servers used for NAT detection. If omitted, built-in defaults
  # (Google, Cloudflare, MiWiFi) are used. Add custom servers here only
  # if the defaults are blocked in your region.
  # stun_servers:
  #   - host: stun.l.google.com
  #     port: 19302
  #   - host: stun.cloudflare.com
  #     port: 3478

# v1.6.11: Android APK release directory. The Android app's in-app
# updater calls GET /api/v1/release/latest to discover new versions,
# then streams the APK via GET /api/v1/release/latest/apk. Publishing
# a new release is just `scp app-debug-vX.Y.Z.apk nas:/.../data/releases/`
# — no DB row, no config edit, no restart. The handler scans this
# directory on every request and returns the highest version found.
releases:
  dir: /data/releases

# v1.8.27: background maintenance loops — SQLite WAL checkpoint /
# daily backup and disk-space monitoring. All values have sane
# defaults; override only what your deployment differs on.
#   - sqlite_db_path: empty → database.path
#   - backup_dir:     empty → <db dir>/backups
#   - disk_path:      empty → <db dir> (the filesystem holding /data)
maintenance:
  # SQLite database path for VACUUM/backup bookkeeping.
  sqlite_db_path: /data/sqlite/app.db
  # Where daily SQLite snapshots are written.
  backup_dir: /data/sqlite/backups
  # How many daily backups to retain.
  backup_keep: 7
  # WAL checkpoint interval (minutes). 360 = every 6 hours.
  checkpoint_interval_minutes: 360
  # Full DB backup interval (hours). 24 = daily. 0 disables backups.
  backup_interval_hours: 24
  # Filesystem to monitor for free space. Empty = database dir.
  disk_path: /data
  # Usage thresholds: warn at 80%, critical at 90%.
  disk_warn_pct: 80
  disk_crit_pct: 90
  # Disk sampling interval (minutes).
  disk_interval_minutes: 10

  # v1.8.28: recording health + size monitors.
  # Frigate's recording root. The api container bind-mounts
  # ./data/frigate to /media/frigate, so recordings live at
  # /media/frigate/recordings.
  recordings_root: /media/frigate/recordings
  # A camera is flagged as recording-stalled when its newest on-disk
  # segment is older than this (minutes).
  recording_stale_after_minutes: 10
  # Recording health scan interval (minutes).
  recording_check_interval_minutes: 5
  # Recording tree size walk interval (hours). 0 disables.
  recording_size_interval_hours: 1
  # Size thresholds for the recordings tree (bytes). 0 disables that
  # level. Example: warn at 400 GiB, crit at 450 GiB.
  recording_size_warn_bytes: 0
  recording_size_crit_bytes: 0

  # Frigate's own SQLite database, backed up daily alongside app.db.
  # The api container sees it at /media/frigate/config/frigate.db.
  frigate_db_path: /media/frigate/config/frigate.db

  # v1.8.28: host CPU + memory monitor.
  sys_resource_interval_minutes: 5
  cpu_warn_pct: 80
  cpu_crit_pct: 95
  mem_warn_pct: 80
  mem_crit_pct: 90
